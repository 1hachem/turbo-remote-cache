name: Deploy to Cloudflare Workers

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches: ['master']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build

      - name: Fetch the Cloudflare and cache credentials from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ci
          secret-path: /turbo
          export-type: env

      - name: Require the cache token
        run: |
          if [ -z "${TURBO_TOKEN:-}" ]; then
            echo "TURBO_TOKEN is missing from Infisical. Refusing to deploy a cache with a guessable token."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          packageManager: 'pnpm'
          preCommands: wrangler r2 bucket create turborepo-cache || true
          secrets: |
            TURBO_TOKEN
          command: deploy
